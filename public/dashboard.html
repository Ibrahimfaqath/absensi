<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <style>
        /* Base Setup & Tema Gelap Teknologi */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container Pembungkus Dashboard */
        .container {
            width: 100%;
            max-width: 1000px;
            background-color: #111827;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #1e293b;
            box-sizing: border-box;
        }

        /* Header Dashboard */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h2 {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
            margin: 0;
        }

        h3 {
            color: #38bdf8;
            margin-top: 30px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* Garis Pemisah (HR) Modifikasi */
        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, #1e293b, #334155, #1e293b);
            margin: 30px 0;
        }

        /* Styling Form Tambah User */
        form {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: flex-end;
        }

        form div {
            display: flex;
            flex-direction: column;
        }

        form label {
            font-size: 14px;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Input, Select, dan Filter Bulan */
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="month"],
        select {
            width: 100%;
            padding: 10px;
            background-color: #111827;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }

        /* Filter Area Absensi */
        .filter-area {
            display: flex;
            align-items: flex-end;
            gap: 15px;
            margin-bottom: 15px;
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }

        .filter-area label {
            font-size: 14px;
            color: #94a3b8;
        }

        /* Ragam Tombol (Buttons) */
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Tombol Utama (Tambah User, Tampilkan) */
        button[type="submit"], 
        .filter-area button {
            background: linear-gradient(135deg, #1e3a8a, #0284c7);
            color: white;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
            grid-column: span 1;
            height: 40px;
        }

        button[type="submit"]:hover,
        .filter-area button:hover {
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.4);
        }

        /* Tombol Logout */
        .dashboard-header button {
            background: linear-gradient(135deg, #475569, #0f172a);
            border: 1px solid #334155;
            color: #f1f5f9;
        }

        .dashboard-header button:hover {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            border-color: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        /* Desain Tabel Data Modern */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1e293b !important; /* Override inline border="1" */
        }

        th, td {
            padding: 12px 15px !important; /* Override inline cellpadding */
            text-align: left;
            border: 1px solid #1e293b !important;
        }

        th {
            background-color: #1e293b;
            color: #00d2ff;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        td {
            font-size: 14px;
            color: #cbd5e1;
        }

        tr:nth-child(even) {
            background-color: #141e30;
        }

        tr:hover {
            background-color: #1e293b;
        }

        /* Feedback Pesan / Result Text */
        #formResult, #absensiResult {
            margin-top: 10px;
            font-size: 14px;
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <div>
                <h2>Dashboard Admin</h2>
                <p style="margin: 5px 0 0 0; color: #94a3b8;">Login sebagai: <strong id="adminLabel" style="color: #00d2ff;">-</strong></p>
            </div>
            <button onclick="logout()">Logout</button>
        </div>

        <h3>Tambah User Baru</h3>
        <form onsubmit="tambahUser(event)">
            <div>
                <label>Nama: <input type="text" id="fieldName" required ></label>
            </div>
            <div>
                <label>Email: <input type="email" id="fieldEmail" required ></label>
            </div>
            <div>
                <label>Password: <input type="password" id="fieldPassword" required></label>
            </div>
            <div>
                <label>Role:
                    <select id="fieldRole">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </label>
            </div>
            <button type="submit">Tambah User</button>
        </form>
        <p id="formResult"></p>

        <hr>

        <h3>Daftar User</h3>
        <table border="1" cellpadding="6">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr>
                    <td colspan="4">Memuat...</td>
                </tr>
            </tbody>
        </table>

        <hr>

        <h3>Rekap Absensi</h3>
        <div class="filter-area">
            <label>
                Bulan:<br>
                <input type="month" id="filterMonth" style="margin-top: 5px; width: 200px;">
            </label>
            <button onclick="loadAbsensi()">Tampilkan</button>
        </div>
        <p id="absensiResult"></p>

        <table border="1" cellpadding="6">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Email</th>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Catatan</th>
                </tr>
            </thead>
            <tbody id="absensiTableBody">
                <tr>
                    <td colspan="5">Pilih bulan lalu klik Tampilkan</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // SEt default filter bulan ke bulan ini
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('filterMonth').value = `${yyyy}-${mm}`;

        // Cek session & tampilkan nama admin
        (async () => {
           const res = await fetch('/auth/me', { credentials: "include" });
           if (!res.ok) { window.location.href ='/login.html'; return }
           const { user } = await res.json();
           document.getElementById('adminLabel').textContent = user.name;
           await loadUsers();
           await loadAbsensi();
        })();

        async function loadUsers() {
            const res = await fetch('/admin/users', { credentials: "include" });
            if (res.status === 401 || res.status === 403) { window.location.href = '/login.html'; return; } 
            const { data } = await res.json();
            const tbody = document.getElementById('userTableBody');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">Belum ada user.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(u => `
            <tr>
                <td>${u.name}</td>
                <td>${u.email}</td>
                <td>${u.role}</td>
                <td>${u.is_active ? 'Aktif' :  'Nonaktif'}</td>
            </tr>    
            `).join('');
        }

        async function tambahUser(e) {
          e.preventDefault();
          const body = {
            name: document.getElementById('fieldName').value.trim(),
            email: document.getElementById('fieldEmail').value.trim(),
            password: document.getElementById('fieldPassword').value.trim(),
            role: document.getElementById('fieldRole').value,
          };

          const res = await fetch('/admin/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            credentials: "include"
          });
          
          const data = await res.json();
          document.getElementById('formResult').textContent = data.message;
          
          if (res.ok) {
            e.target.reset();
            await loadUsers();
          }
        }

        async function loadAbsensi() {
            const month = document.getElementById('filterMonth').value;
            if (!month) {
                document.getElementById('absensiResult').textContent = 'Pilih bulan terlebih dahulu.';
                return;
            }

            const res = await fetch(`/admin/attendances?month=${month}`, { credentials: "include" });
            const data = await res.json();
            const tbody = document.getElementById('absensiTableBody');
            document.getElementById('absensiResult').textContent = '';

            if (!res.ok) {
                document.getElementById('absensiResult').textContent = data.message;
                tbody.innerHTML = '<tr><td colspan="5">-</td></tr>';
                return;
            }

            if (!data.data || data.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">Tidak ada data absensi pada bulan ini.</td></tr>';
                return;
            }

            tbody.innerHTML = data.data.map(a => `
            <tr>
                <td>${a.user_name ?? '_'}</td>
                <td>${a.user_email ?? '_'}</td>
                <td>${formatTanggal(a.check_in)}</td>
                <td>${a.check_out ? formatTanggal(a.check_out) : '_'}</td>
                <td>${a.note ?? '_'}</td>
            </tr>    
            `).join('');
        }

        function formatTanggal(iso) {
            if (!iso) return '_';
            const d = new Date(iso);
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' })
              + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        async function logout() {
            await fetch('/auth/logout', { method: 'POST', credentials: "include" });
            window.location.href = '/login.html';
        }
    </script>  
</body>
</html>
