<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* Mengatur dasar halaman dengan tema hitam/gelap */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* Desain kontainer form menggunakan kombinasi navy dan border menyala (glow) */
        h2 {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Mengatur tampilan input agar serasi dengan tema teknologi */
        input {
            width: 260px;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #111827;
            border: 1px solid #1e293b;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
            background-color: #1f2937;
        }

        /* Placeholder dengan warna biru redup */
        input::placeholder {
            color: #64748b;
        }

        /* Tombol login dengan efek gradient navy ke biru teknologi */
        button {
            width: 286px;
            padding: 12px;
            background: linear-gradient(135deg, #1e3a8a, #0284c7);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Teks hasil respons / error */
        #result {
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
            text-align: center;
            max-width: 280px;
        }
    </style>
</head>

<body>
  <h2>Login Admin</h2>    

  <input id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>

  <button onclick="login()">Login</button>

  <p id="result"></p>

  <script>
    async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const res = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        })

        const data = await res.json();
        document.getElementById("result").innerText = data.message;

        if (!res.ok) return;

        if (data.role === "admin") {
            window.location.href = "/dashboard.html";
        } else {
            window.location.href = "/index.html";
        }
    }
  </script>
</body>
</html>
